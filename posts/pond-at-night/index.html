            <h1>夜里，小水洼收留一枚月亮</h1>
            <div class="article-meta"><time datetime="2026-09-03">2026 年 9 月 3 日</time><span>约 1 分钟阅读</span></div>
        </header>
        <article class="article-body">
            <p class="poem">雨离开以后
                路面留下许多小小的空白

                其中一处
                收留了整枚月亮

                风经过时
                月亮碎了一次
                又一次

                但水面从不解释
                何为破碎
                何为圆满

                它只在夜色里
                把短暂拥有的光
                轻轻还给天空</p>
