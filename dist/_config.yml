title: 羡鱼的小水洼
subtitle: 一处记录科普文章、日常片段与散文诗歌的个人博客。
description: 一处记录科普文章、日常片段与散文诗歌的个人博客。
author: 羡鱼
language: zh-CN
timezone: Asia/Shanghai

url: https://xianyu925.github.io
root: /
permalink: posts/:title/
permalink_defaults: {}
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archive
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 0
  order_by: -date
archive_generator:
  per_page: 0
  yearly: false
  monthly: false
category_generator:
  per_page: 0

category_map:
  科普: science
  日常: daily
  诗歌: literature

meta_generator: true
date_format: YYYY 年 M 月 D 日
time_format: HH:mm:ss
updated_option: mtime
per_page: 0
pagination_dir: page
theme: xiaoshuiwa

deploy:
  type: ''
